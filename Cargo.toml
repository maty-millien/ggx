[package]
name = "ggx"
version = "0.6.4"
edition = "2024"
description = "A fast AI-powered git workflow CLI"
repository = "https://github.com/maty-millien/ggx"
homepage = "https://github.com/maty-millien/ggx"
license = "MIT"
readme = "docs/README.md"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
anyhow = "1.0.104"
console = "0.16.4"
indicatif = "0.18.6"
libc = "0.2.189"
serde_json = "1.0.151"

[profile.dist]
inherits = "release"
lto = "thin"
