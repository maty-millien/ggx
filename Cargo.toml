[package]
name = "ggx"
version = "0.8.7"
edition = "2024"
description = "A fast AI-powered git workflow CLI"
repository = "https://github.com/maty-millien/ggx"
homepage = "https://github.com/maty-millien/ggx"
license = "MIT"
readme = "docs/README.md"
autotests = false

[[test]]
name = "e2e"
path = "tests/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
anyhow = "1.0.104"
console = "0.16.6"
indicatif = "0.18.6"
libc = "0.2.190"
serde_json = "1.0.151"
base64 = "0.23.1"

[profile.dist]
inherits = "release"
lto = "thin"
