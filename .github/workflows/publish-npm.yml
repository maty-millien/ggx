name: Publish npm package

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
    secrets:
      NPM_TOKEN:
        required: true

jobs:
  publish:
    runs-on: ubuntu-22.04
    env:
      PLAN: ${{ inputs.plan }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Fetch release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: ${{ runner.temp }}/artifacts
          merge-multiple: true
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Build npm package
        run: |
          version=$(echo "$PLAN" | jq --raw-output '.releases[0].app_version')
          scripts/package-npm.sh "${{ runner.temp }}/artifacts" "${{ runner.temp }}/ggx-ai-package" "$version"
      - id: npm-tag
        name: Select npm tag
        run: |
          if [ "$(echo "$PLAN" | jq --raw-output '.announcement_is_prerelease')" = "true" ]; then
            echo "value=next" >> "$GITHUB_OUTPUT"
          else
            echo "value=latest" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish npm package
        run: npm publish "${{ runner.temp }}/ggx-ai-package" --access public --tag "${{ steps.npm-tag.outputs.value }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
